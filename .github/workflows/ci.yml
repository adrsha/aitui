name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (locked)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test all targets
        run: cargo test --locked --all-targets

  python:
    name: Python (locked)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install pinned test environment
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps --editable .

      - name: Run Python tests
        run: python -m pytest
